[project]
name = "GPT-SoVITS-Inference"
version = "0.0.2"
description = ""
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "librosa==0.9.2",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "fastapi[standard]>=0.115.8",
    "uvicorn[standard]>=0.33.0",
    "socksio>=1.0.0",
    "pytorch-lightning>=2.5.2",
    "tomli-w>=1.2.0",
    "einops>=0.8.1",
    "tqdm>=4.67.1",
    "wordsegment>=1.3.1",
    "langsegment>=0.2.0",
    "transformers>=4.53.0",
    "g2p-en>=2.1.0",
    "jieba-fast>=0.53",
    "pyopenjtalk>=0.4.1",
    "pypinyin>=0.54.0",
    "cn2an>=0.5.23",
    "ffmpeg-python>=0.2.0",
    "soundfile>=0.13.1",
    "pydub>=0.25.1",
    "pydantic>=2.11.7",
    "scipy>=1.16.0",
]
authors = [{ name = "MrXnneHang", email = "XnneHang@gmail.com" }]
keywords = []
license = { text = "MIT" }
classifiers = [
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: Implementation :: CPython",
]

[project.scripts]
gsv_setting = "gsv.config_manager.gsv:main" # 获取项目所在根目录绝对路径, 防止 streamlit UI 中默认以 `.` 作为根目录而找不到一些文件.


[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu118", marker = "sys_platform == 'win32'" }, # sys_platform : 'win32' , 'linux' , 'Darwin'
  { index = "pytorch-cpu", marker = "sys_platform != 'win32'"}
]
torchaudio = [
  { index = "pytorch-cu118", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform != 'win32'"}
]


[tool.hatch.build.targets.wheel]
packages = ["src/gsv"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
