[project]
name = "GPT-SoVITS-Inference"
version = "0.0.1"
description = ""
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "requests",
    "pydub",
    "pydantic",
    "soundfile",
    "flash-attention",
    "numpy",
    "scipy",
    "tensorboard",
    "librosa==0.9.2",
    "numba",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "gradio>=4.29",
    "gradio_client",
    "ffmpeg-python",
    "onnxruntime",
    "tqdm",
    "funasr==1.0.0",
    "cn2an",
    "pypinyin",
    "pyopenjtalk",
    "g2p_en",
    "modelscope==1.10.0",
    "sentencepiece",
    "transformers",
    "chardet",
    "PyYAML",
    "psutil",
    "jieba_fast",
    "jieba",
    "LangSegment",
    "Faster_Whisper",
    "fastapi",
    "uvicorn",
    "wordsegment",
    "srt",
    "pyloudnorm",
    "socksio>=1.0.0",
    "pytorch-lightning>=2.5.2",
    "matplotlib>=3.10.3",
    "tomli-w>=1.2.0",
]
authors = [{ name = "MrXnneHang", email = "XnneHang@gmail.com" }]
keywords = []
license = { text = "MIT" }
classifiers = [
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: Implementation :: CPython",
]

[project.scripts]
setting = "gsv.config_manager.gsv:main" # 获取项目所在根目录绝对路径, 防止 streamlit UI 中默认以 `.` 作为根目录而找不到一些文件.


[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu118", marker = "sys_platform == 'win32'" }, # sys_platform : 'win32' , 'linux' , 'Darwin'
  { index = "pytorch-cpu", marker = "sys_platform != 'win32'"}
]
torchaudio = [
  { index = "pytorch-cu118", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform != 'win32'"}
]


[tool.hatch.build.targets.wheel]
packages = ["src/gsv"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
